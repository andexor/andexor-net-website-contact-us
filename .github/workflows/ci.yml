# Pull requests: deploy to the shared preview and smoke test it.
# Push to main: deploy to the shared preview and smoke test it, and only if that passes, deploy to production.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Turn off Workers Builds for this repository, or every push is built and deployed twice.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Account workers.dev subdomain. Preview URLs are <name>-<worker>.<subdomain>.workers.dev
  WORKERS_SUBDOMAIN: andexor
  # Every run deploys to this one preview, so previews never pile up. Runs take turns.
  PREVIEW_NAME: preview

jobs:
  preview:
    name: Preview and smoke test
    runs-on: ubuntu-latest
    concurrency:
      group: preview-environment
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Deploy preview
        run: uv run pywrangler preview --name "${PREVIEW_NAME}"

      - name: TEMP probe production from the runner
        continue-on-error: true
        run: .github/scripts/check-health.sh https://andexor.net/api/contact/health 8 2

      - name: Smoke test preview
        run: |
          WORKER=$(jq -r '.name' wrangler.jsonc)
          BASE="https://${PREVIEW_NAME}-${WORKER}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "Preview: ${BASE}"

          # Liveness only. A new preview can take a few seconds to answer.
          .github/scripts/check-health.sh "${BASE}/api/contact/health" 10 3

          # A real API call that writes a row to the preview database. The production
          # deploy job never does this. A 500 here is final, so it is not retried.
          # The cause of a failure is in the service logs, not in the response.
          RND=$(printf '%05d' $((RANDOM * 3 % 100000)))
          BODY=$(jq -n --arg r "${RND}" --arg run "${GITHUB_RUN_ID}" '{
            name: ("CI " + $r), email: ("ci-" + $r + "@example.com"),
            phone: ("+1-555-01" + $r[0:2]), website: ("https://ci-" + $r + ".example.com"),
            help: ("CI run " + $run), sourcePath: ("/ci/" + $r)}')
          STATUS=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            -X POST "${BASE}/api/contact" -H 'Content-Type: application/json' -d "${BODY}")
          echo "POST /api/contact returned ${STATUS}"
          cat response.json
          echo
          if [[ "${STATUS}" != 2* ]] || ! jq -e '.ok == true' response.json > /dev/null; then
            echo "::error::POST /api/contact failed with ${STATUS}. See the service logs for the cause."
            exit 1
          fi

  deploy:
    name: Deploy to production
    needs: preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync

      - name: Deploy
        run: uv run pywrangler deploy

      - name: Production health check
        run: .github/scripts/check-health.sh https://andexor.net/api/contact/health 10 3
